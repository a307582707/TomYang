name: static-checks
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip pyyaml
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep || sudo apt-get install -y shellcheck
          KUBECONFORM_VERSION=0.6.7
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: Run static checks
        run: bash scripts/run-static-checks.sh
      - name: PR whitespace
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          if ! git merge-base --is-ancestor "$base" HEAD 2>/dev/null && ! git merge-base "$base" HEAD >/dev/null 2>&1; then
            echo "No merge base with $base; skipping three-dot whitespace check"
            exit 0
          fi
          git diff --check "${base}...HEAD"
