name: static-checks
on:
  push:
    branches: [master]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip pyyaml
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep || sudo apt-get install -y shellcheck
      - name: Run static checks
        run: bash scripts/run-static-checks.sh
      - name: PR whitespace
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}" && git diff --check "origin/${{ github.base_ref }}"...HEAD
