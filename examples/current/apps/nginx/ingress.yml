apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: default
  labels:
    app: nginx
  annotations:
    # 按现网控制器调整；勿照搬 extensions/v1beta1 时代注解
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: "{{ INGRESS_CLASS_NAME }}"
  rules:
  - host: "{{ NGINX_HOST }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx
            port:
              name: http
