# 最小 networking.k8s.io/v1 Ingress（独立于 apps/nginx，便于 controller 目录自洽）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reference-http
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: "{{ INGRESS_CLASS_NAME }}"
  rules:
  - host: "{{ REFERENCE_INGRESS_HOST }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: reference-backend
            port:
              number: 80
  tls:
  - hosts:
    - "{{ REFERENCE_INGRESS_HOST }}"
    secretName: "{{ INGRESS_TLS_SECRET_NAME }}"
