# TLS Secret 占位符 — 部署前用真实 cert/key 渲染或 kubectl create secret tls 替代。
# 勿将 PEM 明文提交仓库。
apiVersion: v1
kind: Secret
metadata:
  name: "{{ INGRESS_TLS_SECRET_NAME }}"
  namespace: "{{ INGRESS_TLS_NAMESPACE }}"
type: kubernetes.io/tls
stringData:
  tls.crt: |
    {{ INGRESS_TLS_CERT_PEM }}
  tls.key: |
    {{ INGRESS_TLS_KEY_PEM }}
