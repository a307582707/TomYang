apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: "{{ LOGGING_NAMESPACE }}"
  labels:
    app: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            docker
        DB                /tmp/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Keep_Log            Off

    # 开发/实验：直接看 DaemonSet Pod stdout
    [OUTPUT]
        Name   stdout
        Match  kube.*
        Format json_lines

    # 占位后端：部署前替换 {{ LOG_FORWARD_HTTP_ENDPOINT }}
    [OUTPUT]
        Name            http
        Match           kube.*
        Host            {{ LOG_FORWARD_HTTP_HOST }}
        Port            {{ LOG_FORWARD_HTTP_PORT }}
        URI             {{ LOG_FORWARD_HTTP_URI }}
        Format          json
        json_date_key   timestamp
        json_date_format iso8601
        tls             Off

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On
