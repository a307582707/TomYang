# Fictional ExternalSecret skeletons only — DO NOT apply with real credentials.
# Requires a cluster External Secrets Operator + a ClusterSecretStore/SecretStore you define out-of-band.
# Values below are placeholders for docs/examples; never commit production secrets.
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: fictional-vault-store
  namespace: monitoring
spec:
  provider:
    fake:
      data:
        - key: grafana/admin-user
          value: "{{ GRAFANA_ADMIN_USER }}"
        - key: grafana/admin-password
          value: "{{ GRAFANA_ADMIN_PASSWORD }}"
        - key: alertmanager/smtp-password
          value: "{{ ALERTMANAGER_SMTP_PASSWORD }}"
        - key: haproxy/stats-user
          value: "{{ HAPROXY_STATS_USER }}"
        - key: haproxy/stats-password
          value: "{{ HAPROXY_STATS_PASSWORD }}"
---
# Grafana admin credentials → Secret consumed by Deployment envFrom / volume
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-fictional
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fictional-vault-store
    kind: SecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana/admin-user
    - secretKey: admin-password
      remoteRef:
        key: grafana/admin-password
---
# Alertmanager receiver secret (SMTP / webhook token placeholders)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-receiver-fictional
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fictional-vault-store
    kind: SecretStore
  target:
    name: alertmanager-main
    creationPolicy: Owner
  data:
    - secretKey: smtp-password
      remoteRef:
        key: alertmanager/smtp-password
---
# HAProxy stats basic-auth material for host config render (not a typical in-cluster Secret;
# shown as ExternalSecret → opaque Secret that your render/CI may read from a sealed channel).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: haproxy-stats-fictional
  namespace: kube-system
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: fictional-vault-store
    kind: SecretStore
  target:
    name: haproxy-stats-credentials
    creationPolicy: Owner
  data:
    - secretKey: stats-user
      remoteRef:
        key: haproxy/stats-user
    - secretKey: stats-password
      remoteRef:
        key: haproxy/stats-password
