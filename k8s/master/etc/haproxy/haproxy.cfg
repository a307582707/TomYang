global
  maxconn  2000
  ulimit-n  16384
  log  127.0.0.1 local0 err
  stats timeout 30s

defaults
  log global
  mode  http
  option  httplog
  timeout connect 5000
  timeout client  50000
  timeout server  50000
  timeout http-request 15s
  timeout http-keep-alive 15s

frontend monitor-in
  bind *:33305
  mode http
  option httplog
  monitor-uri /monitor

listen stats
  bind    *:8006
  mode    http
  stats   enable
  stats   hide-version
  stats   uri       /stats
  stats   refresh   30s
  stats   realm     Haproxy\ Statistics
  stats   auth      {{ HAPROXY_STATS_USER }}:{{ HAPROXY_STATS_PASSWORD }}

frontend k8s-api
  bind 0.0.0.0:8443
  bind 127.0.0.1:8443
  mode tcp
  option tcplog
  tcp-request inspect-delay 5s
  default_backend k8s-api

backend k8s-api
  mode tcp
  option tcplog
  option tcp-check
  balance roundrobin
  default-server inter 10s downinter 5s rise 2 fall 2 slowstart 60s maxconn 250 maxqueue 256 weight 100
  # HA control plane: at least 3 masters for quorum-friendly lab (odd number).
  # Minimum for this template: 3 server lines. Single-master lab may comment master2/3.
  # Ports: Keepalived VIP :8443 → HAProxy → apiserver secure-port :5443 (see Wiki INFRA-01).
  # Do NOT commit real IPs; render via docs/placeholders + scripts/render.
  server master1 {{ MASTER1_IP }}:5443 check
  server master2 {{ MASTER2_IP }}:5443 check
  server master3 {{ MASTER3_IP }}:5443 check
