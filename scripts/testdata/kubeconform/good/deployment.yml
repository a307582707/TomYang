apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeconform-fixture-good
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeconform-fixture-good
  template:
    metadata:
      labels:
        app: kubeconform-fixture-good
    spec:
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
